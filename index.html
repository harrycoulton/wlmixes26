<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100dvh;
    padding-bottom: 80px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #0a0a0a;
    padding: 16px 16px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
  .tabs {
    display: flex; gap: 0;
  }
  .tab {
    flex: 1; text-align: center;
    padding: 10px; font-size: 14px; font-weight: 500;
    background: none; border: none; color: #666;
    border-bottom: 2px solid transparent;
    cursor: pointer; transition: all 0.2s;
  }
  .tab.active { color: #fff; border-bottom-color: #ff6b35; }
  .search {
    width: 100%; padding: 10px 14px;
    background: #161616; border: 1px solid #2a2a2a; border-radius: 10px;
    color: #e0e0e0; font-size: 15px; outline: none;
    margin: 12px 0;
  }
  .search::placeholder { color: #555; }
  .search:focus { border-color: #ff6b35; }
  .list { padding: 8px 0; }
  .artist {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid #141414;
    transition: background 0.15s;
  }
  .artist:active { background: #161616; }
  .like-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
    font-size: 18px; color: #555;
  }
  .like-btn.liked {
    background: #ff6b35; border-color: #ff6b35; color: #fff;
  }
  .artist-info { flex: 1; min-width: 0; }
  .artist-row {
    display: flex; align-items: center; gap: 8px;
  }
  .artist-name {
    font-size: 15px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .artist-name .b2b-tag {
    font-size: 11px; font-weight: 400; color: #ff6b35;
    background: rgba(255, 107, 53, 0.12); padding: 2px 6px;
    border-radius: 4px; margin-left: 6px; vertical-align: middle;
  }
  .mix-link {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: #ff6b35; text-decoration: none;
    background: rgba(255, 107, 53, 0.08);
    padding: 4px 10px; border-radius: 6px; white-space: nowrap;
  }
  .mix-link:hover { background: rgba(255, 107, 53, 0.18); }
  .mix-link.b2b-mix { color: #6bb5ff; background: rgba(107, 181, 255, 0.08); }
  .mix-link.b2b-mix:hover { background: rgba(107, 181, 255, 0.18); }
  .b2b-links { display: flex; gap: 6px; margin-top: 4px; }
  .empty {
    text-align: center; padding: 60px 20px;
    color: #444; font-size: 15px;
  }
  .count {
    font-size: 12px; color: #555; padding: 8px 16px;
  }

function getLikes() {
  try { return JSON.parse(localStorage.getItem('wl2026-likes') || '{}'); } catch { return {}; }
}
function setLikes(likes) {
  localStorage.setItem('wl2026-likes', JSON.stringify(likes));
}

let currentTab = 'all';
let searchQuery = '';

function getMixLabel(url) {
  if (!url) return 'Mix';
  if (url.includes('wakinglife')) return 'Waking Life';
  if (url.includes('draaimolen')) return 'Draaimolen';
  if (url.includes('houghton')) return 'Houghton';
  if (url.includes('dkmntl') || url.includes('dekmantel')) return 'Dekmantel';
  if (url.includes('horst')) return 'Horst';
  if (url.includes('dimensionsfestival')) return 'Dimensions';
  if (url.includes('platform/') || url.includes('boiler')) return 'Boiler Room';
  if (url.includes('dgtl')) return 'DGTL';
  if (url.includes('kioskradio')) return 'Kiosk Radio';
  if (url.includes('crackmagazine')) return 'Crack Mix';
  if (url.includes('noisily')) return 'Noisily';
  if (url.includes('dreaming-festival')) return 'Dreaming Fest';
  if (url.includes('getdarker')) return 'Outlook';
  if (url.includes('kleinundhaarig')) return 'KuH Fest';
  if (url.includes('sunwaves') || url.includes('cel-ce-asteapta')) return 'Sunwaves';
  if (url.includes('thelotradio')) return 'Lot Radio';
  if (url.includes('garbicz')) return 'Garbicz';
  if (url.includes('musicmanrecords')) return 'Music Man';
  const host = new URL(url).pathname;
  if (host.split('/').length <= 2) return 'Profile';
  return 'Mix';
}

function render() {
  const likes = getLikes();
  const q = searchQuery.toLowerCase();
  let filtered = ARTISTS.filter(a => a.name.toLowerCase().includes(q));
  if (currentTab === 'liked') filtered = filtered.filter(a => likes[a.name]);

  const countEl = document.getElementById('count');
  if (currentTab === 'liked') {
    const n = filtered.length;
    countEl.textContent = n + ' liked artist' + (n !== 1 ? 's' : '');
  } else {
    countEl.textContent = filtered.length + ' of ' + ARTISTS.length + ' artists';
  }

  const listEl = document.getElementById('list');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">' +
      (currentTab === 'liked' ? 'No liked artists yet.<br>Tap the heart on artists you want to check out.' : 'No artists match your search.') +
      '</div>';
    return;
  }

  listEl.innerHTML = filtered.map(a => {
    const liked = likes[a.name] ? ' liked' : '';
    const isB2b = a.b2b != null;
    const b2bTag = isB2b ? '<span class="b2b-tag">B2B</span>' : '';

    const mixLink = a.mix
      ? '<a class="mix-link" href="' + a.mix + '" target="_blank">mix link</a>'
      : '';
    const b2bLink = a.b2bMix
      ? '<a class="mix-link b2b-mix" href="' + a.b2bMix + '" target="_blank">' + a.b2b + ' mix</a>'
      : '';

    return '<div class="artist" data-name="' + a.name.replace(/"/g, '&quot;') + '">' +
      '<button class="like-btn' + liked + '" aria-label="Like ' + a.name + '">' +
        (likes[a.name] ? '\u2665' : '\u2661') +
      '</button>' +
      '<div class="artist-info">' +
        '<div class="artist-row">' +
          '<div class="artist-name">' + a.name + b2bTag + '</div>' +
          mixLink +
        '</div>' +
        (b2bLink ? '<div class="b2b-links">' + b2bLink + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  listEl.querySelectorAll('.like-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const name = btn.closest('.artist').dataset.name;
      const likes = getLikes();
      if (likes[name]) delete likes[name]; else likes[name] = true;
      setLikes(likes);
      render();
    });
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

render();
